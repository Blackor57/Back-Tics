services:
  # =========================================================
  # MICROSERVICIO 4: PERSISTENCIA (POSTGRESQL 16)
  # =========================================================
  db:
    image: pgvector/pgvector:pg16
    container_name: simap_postgres
    restart: always
    environment:
      POSTGRES_DB: simap_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - simap_net

  # =========================================================
  # MICROSERVICIO 3: INTELIGENCIA ARTIFICIAL LOCAL (OLLAMA)
  # =========================================================
  ollama:
    image: ollama/ollama:latest
    container_name: simap_ollama
    restart: always
    ports:
      - "11434:11434"
    environment:
      # --- PERFIL DE BAJO CONSUMO (objetivo < 3 GB de RAM en total) ---
      # Mantiene el modelo descargado en RAM sólo 5 minutos después del último uso.
      OLLAMA_KEEP_ALIVE: 5m
      # Usa caché KV cuantizada a 8 bits: ~50% menos RAM que fp16 con pérdida mínima.
      OLLAMA_KV_CACHE_TYPE: q8_0
      # Un solo modelo cargado a la vez y una sola petición paralela -> menor footprint.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - simap_net

  # =========================================================
  # MICROSERVICIO 2: WORKER DE SCRAPING (PLAYWRIGHT & CHROMIUM)
  # Aislado en su propio contenedor para proteger memoria y CPU
  # =========================================================
  scraper_service:
    build: ./scraper_service
    container_name: simap_scraper_service
    restart: always
    ports:
      - "8001:8001"
    networks:
      - simap_net

  # =========================================================
  # MICROSERVICIO 1: CORE API, AUTH & ORQUESTADOR (FASTAPI)
  # Gestiona Auth JWT, Historial, Programación y Reportes
  # =========================================================
  backend:
    build: .
    container_name: simap_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres_password@db:5432/simap_db
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_TIMEOUT_SECONDS: 300
      EMBEDDING_MODEL: nomic-embed-text
      SCRAPER_SERVICE_URL: http://scraper_service:8001
    volumes:
      - ./reports:/app/reports
    depends_on:
      - db
      - ollama
      - scraper_service
    networks:
      - simap_net

  # =========================================================
  # MICROSERVICIO 5: ASISTENTE CONVERSACIONAL (FASTAPI + OLLAMA + RAG)
  # Consulta PostgreSQL (text-to-SQL + pgvector), usa Redis para memoria
  # de sesión y expone /chat vía Server-Sent Events para el frontend React.
  # =========================================================
  chatbot_service:
    build: ./chatbot_service
    container_name: simap_chatbot_service
    restart: always
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres_password@db:5432/simap_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: simap_db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: llama3.2:3b
      OLLAMA_EMBED_MODEL: nomic-embed-text
      CHAT_HISTORY_TURNS: "10"
      BACKEND_API_URL: http://backend:8000
    depends_on:
      - redis
      - db
      - ollama
    networks:
      - simap_net

  # =========================================================
  # MICROSERVICIO 6: REDIS (MEMORIA DE CONVERSACIÓN DEL CHATBOT)
  # Almacena los últimos N turnos por session_id (persistente en volumen)
  # =========================================================
  redis:
    image: redis:7-alpine
    container_name: simap_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - simap_net

volumes:
  postgres_data:
  ollama_data:
  redis_data:

networks:
  simap_net:
    driver: bridge