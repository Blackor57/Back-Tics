version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: simap_postgres
    restart: always
    environment:
      POSTGRES_DB: simap_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: .
    container_name: simap_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password@db:5432/simap_db
    depends_on:
      - db

volumes:
  postgres_data: